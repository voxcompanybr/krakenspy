[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/ig"
  to = "/.netlify/functions/ig"
  status = 200
  force = true

[[redirects]]
  from = "/painel"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
