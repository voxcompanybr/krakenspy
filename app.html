<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel — KrakenSpy</title>
<meta name="theme-color" content="#000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='46'%3E%F0%9F%90%99%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body class="app-mode">
<div class="phone">
  <header class="topbar">
    <button class="icon" id="backBtn" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15.5 3.5 7 12l8.5 8.5 1.4-1.4L9.8 12l7.1-7.1z"/></svg></button>
    <h1 id="acct">conta</h1>
    <span class="sim-badge">simulação</span>
    <div class="icons">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.6 15.6 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .57 3.6 1 1 0 0 1-.25 1z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M3 5h18v11H7l-4 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </div>
  </header>
  <div class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="1.8"/></svg>
    <input placeholder="Pergunte à Meta AI ou pesquise" readonly>
  </div>
  <div class="stories" id="stories"></div>
  <div class="section-head"><h2>Mensagens</h2><span class="req">Pedidos (4)</span></div>
  <ul class="chats" id="chats"></ul>
</div>

<div class="vipbar" id="vipbar">
  <div class="vb-left">
    <p><b>Prévia disponível por <span id="clock">10:00</span></b></p>
    <p class="vb-sub">Você tem 10 minutos para explorar. Para liberar tudo de forma permanente é preciso ser VIP.</p>
  </div>
  <button class="vb-btn" id="vipBtn">Virar VIP</button>
</div>

<div class="chatview" id="viewChat" hidden>
  <header class="cv-head">
    <button class="back" id="cvBack" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15.5 3.5 7 12l8.5 8.5 1.4-1.4L9.8 12l7.1-7.1z"/></svg></button>
    <img id="cvAv" alt="">
    <div class="cv-id"><b id="cvName"></b><small id="cvStatus">Online</small></div>
    <div class="cv-acts">
      <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.6 15.6 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .57 3.6 1 1 0 0 1-.25 1z"/></svg>
      <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 11 5-3v8l-5-3z"/></svg>
    </div>
  </header>
  <div class="cv-body" id="cvBody"></div>
  <footer class="cv-foot">
    <button class="cam"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.4" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M4 12a8 8 0 0 1 8-8M20 12a8 8 0 0 1-8 8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <input class="cv-in" id="cvIn" placeholder="Mensagem..." readonly>
    <div class="cv-ic">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12Z"/></svg>
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="10" r="1.8"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.3"/><circle cx="15" cy="10" r="1.3"/><path d="M9 14.5c.8.9 1.8 1.3 3 1.3s2.2-.4 3-1.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.4-9A5.4 5.4 0 0 1 12 6.5 5.4 5.4 0 0 1 21.4 12c-1.9 4.4-9.4 9-9.4 9Z"/></svg>
    </div>
  </footer>
</div>

<div class="modal" id="vipModal">
  <div class="sheet vip-sheet">
    <h2 class="m-title"><span class="hl">⚠</span> Ação bloqueada</h2>
    <p class="m-text" id="vipMsg">Libere o painel completo do KrakenSpy com o acesso VIP</p>
    <button class="btn-primary" id="vipCta">Adquirir Acesso VIP</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/config.js"></script>
<script src="/js/common.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
